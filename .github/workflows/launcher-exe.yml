name: Launcher exe

# Builds one portable Windows exe and publishes it on this repo's rolling "launcher" release.
# Does not publish to Daniiltoptl/FestVisuals-Releases — that stays on main in launcher.yml.

on:
  push:
    branches:
      - arena/f4911e93-festvisuals
    paths:
      - 'launcher/**'
      - 'jarvis-server/**'
      - '.github/workflows/launcher-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Build Windows exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --publish never

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          exe=(release/*.exe)
          if [ ${#exe[@]} -ne 1 ]; then
            echo "expected one exe, found: ${exe[*]}"
            exit 1
          fi
          bytes=$(wc -c < "${exe[0]}")
          echo "exe=${exe[0]} bytes=${bytes}"
          # Electron's own Windows runtime is ~158 MB packed. Above 170 MB means a second copy
          # or the mod jar slipped back in.
          if [ "$bytes" -gt 170000000 ]; then
            echo "exe is heavier than 170 MB"
            exit 1
          fi
          notes=$(printf '%s\n' \
            'Один portable exe для Windows, без установщика.' \
            'Мод скачивается при первом запуске — нужен интернет.' \
            "Сборка: ${GITHUB_SHA}")
          if gh release view launcher >/dev/null 2>&1; then
            gh release upload launcher "${exe[0]}" --clobber
            gh release edit launcher --target "$GITHUB_SHA" --title "FestVisuals Launcher" --notes "$notes" --latest
          else
            gh release create launcher "${exe[0]}" --target "$GITHUB_SHA" --title "FestVisuals Launcher" --notes "$notes" --latest
          fi

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: festvisuals-launcher-exe
          path: launcher/release/*.exe
          retention-days: 14
          if-no-files-found: error
